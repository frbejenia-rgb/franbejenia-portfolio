pre:`<div class="note"><p><b>Recognition:</b> 1st Runner-Up, Best Paper Presentation — CET Conversazione 2026. A collaborative research project focused on developing an autonomous cultivation chamber to support tomato seedling growth and help address practical agricultural needs.</p></div>
${hd("Key","features.")}${ul(["<b>Environmental Monitoring:</b> Tracks temperature, humidity, soil moisture, soil pH, NPK levels, and CO₂.","<b>Automated Cultivation:</b> Integrates irrigation, cooling, and LED grow lighting to support controlled growing conditions.","<b>Intelligent Monitoring:</b> Uses an ESP32-CAM for camera-based monitoring and incorporates bioelectrical root stimulation."])}
${hd("SeedSpark","Research")}<p class="full">SeedSpark: Development of an Autonomous Electro-Photosynthetic Microclimate Chamber for <i>Solanum lycopersicum</i> (Tomato) Seedling Growth with Biofeedback and Climate-Adaptive Regulation</p>
<p style="max-width:46em">SeedSpark is a team-based research project developed from my research concept to explore how technology can support farmers in cultivating tomato seedlings more efficiently. The system combines environmental monitoring, automated climate regulation, and bioelectrical root stimulation within a controlled growing chamber. By monitoring growing conditions and coordinating functions such as irrigation, cooling, and LED grow lighting, SeedSpark aims to help farmers manage seedling cultivation through a more controlled, technology-assisted approach.</p>
<p style="max-width:46em">The system integrates embedded technology, environmental sensors, camera-based monitoring, and a Flutter mobile companion application connected to Firebase, enabling system monitoring and data access.</p>
${hd("My","contributions.")}${ul(["<b>Research Concept and Documentation:</b> Initiated the research concept and worked on the research paper from development through final documentation and hardbound submission.","<b>System Design and Integration:</b> Contributed to overall system design and integrated hardware and software components, connecting the embedded system, sensors, camera, mobile application, and database.","<b>Firmware Development:</b> Developed firmware for sensor data handling and system functions.","<b>Mobile Application and Database:</b> Developed the Flutter companion application and Firebase database integration.","<b>Camera Integration:</b> Worked on integrating camera-based monitoring into the system.","<b>Testing and Troubleshooting:</b> Troubleshot hardware-software integration issues, tested system functions, and assisted with calibration."])}
<p style="max-width:46em"><b>Team Collaboration:</b> Collaborated with groupmates who handled physical hardware connections and the chamber enclosure, alongside their other project contributions.</p>`,
s2:[{h:["Event","highlights."],cards:[{t:"CET Technofair 2026 — Engineering Design Project Exhibit",d:"SeedSpark was showcased at CET Technofair 2026 under the theme “Uniting Ideas, Building Partnerships, Powering a Sustainable Future.” We presented our autonomous tomato seedling cultivation chamber to a panel of three judges, explaining its design, functionality, and potential application in agriculture. The exhibit also gave fellow students and other visitors the opportunity to learn about our research, ask questions, and explore how technology can support tomato seedling cultivation.",i:"technofair"},{t:"CET Conversazione 2026 — Research Presentation",d:"CET Conversazione 2026 provided the platform for presenting our completed SeedSpark research and working prototype. We defended our project before a judge, answering questions about the system, its implementation, and its objectives. The presentation recognized our team's work in developing a technology-assisted approach to tomato seedling cultivation, with the project receiving 1st Runner-Up for Best Paper Presentation. The recognition encouraged us to continue exploring practical engineering solutions that address agricultural needs.",i:"conversazione"},{t:"CODEE Region XI, 16th Engineering Congress — Prototype Presentation",d:"SeedSpark was selected to represent our school's engineering research at the CODEE Region XI, 16th Engineering Congress, held at Lyceum of the Philippines University. Competing in the agricultural category, we presented our prototype to a panel of three judges and discussed its design, operation, and potential contribution to tomato seedling cultivation. The event brought together engineering schools from across the Davao Region, giving our team the opportunity to showcase our work and engage with a broader engineering community.",i:"codee"}]},

s2:[{h:["Selected","projects."],cards:[{t:"100-W Mono Audio Amplifier (2024)",d:"A 100-watt mono audio amplifier designed and assembled to deliver powerful audio output for sound system applications. The project involved studying amplifier circuit design, selecting electronic components, and constructing an enclosed amplifier paired with a speaker cabinet. It provided hands-on experience in analog electronics, audio amplification, circuit assembly, and troubleshooting while applying concepts learned in Computer Engineering.",i:"amplifier"},{t:"The Range — Fun Fair Exhibit (2024)",d:"An interactive arcade-style game booth developed for a college fun fair, combining electronic components and gameplay to create an engaging experience for participants. Inspired by target-shooting games, the project explored the practical application of electronics in interactive entertainment and demonstrated how engineering concepts can be used to build an engaging physical game experience.",i:"funfair"},{t:"Automatic Lampshade Using an LDR (2024)",d:"An automatic lighting project that uses a light-dependent resistor (LDR) and a transistor acting as a switch to control a lamp based on surrounding light conditions. The circuit responds to low-light conditions by activating the lighting system, demonstrating the use of light sensors and transistor switching in a simple automation application. The project was also showcased during a class exhibit.",i:"lampshade"},{t:"Seismic Activity Alert System (2025)",d:"A prototype earthquake alert system demonstrated using a model village to illustrate how seismic activity warnings could be communicated to residents. The system features an LCD display and a buzzer for alerts, while individual model houses use green, yellow, and red LEDs to indicate different alert levels based on the detected earthquake magnitude. The project demonstrates sensor-based monitoring, visual and audible alerts, and the potential role of electronic warning systems in community preparedness.",i:"seismic"},{t:"Cobot — Obstacle-Avoiding Quadruped Robot (2025)",d:"A crab-like, four-legged robot designed to detect and avoid obstacles using an ultrasonic sensor. When an obstacle is detected, the robot performs a programmed dance accompanied by the Mario theme before changing direction and navigating toward a path without detected obstacles. The project combines robotics, sensor integration, movement control, and programmed responses to create an interactive obstacle-avoidance system.",i:"cobot"}]}]},

(()=>{const cv=document.getElementById("cb");if(!cv)return;const cx=cv.getContext("2d"),root=document.documentElement,
rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
let W,H,dpr,paths=[],raf=0,last=0;
const G=44,D=[[1,0],[-1,0],[0,1],[0,-1]],rnd=(a,b)=>a+Math.random()*(b-a);
function build(){dpr=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
paths=[];const n=Math.min(40,Math.round(W*H/32000));
for(let k=0;k<n;k++){let x=Math.round(rnd(0,W)/G)*G,y=Math.round(rnd(0,H)/G)*G,d=D[Math.random()*4|0];const pts=[[x,y]],segs=3+(Math.random()*5|0);
for(let s=0;s<segs;s++){const len=G*(1+(Math.random()*4|0));x+=d[0]*len;y+=d[1]*len;pts.push([x,y]);
if(Math.random()<.35){const dg=[d[0]+(Math.random()<.5?1:-1)*d[1],d[1]+(Math.random()<.5?1:-1)*d[0]];const L=G*(1+(Math.random()*2|0));x+=Math.sign(dg[0])*L;y+=Math.sign(dg[1])*L;pts.push([x,y]);}
const t=D[Math.random()*4|0];if(t[0]!==-d[0]||t[1]!==-d[1])d=t;}
const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
paths.push({pts,cum,tot:cum[cum.length-1],pos:rnd(-200,cum[cum.length-1]),sp:rnd(55,120),len:rnd(60,110)});}}
function at(p,d){d=Math.max(0,Math.min(p.tot,d));let i=1;while(i<p.cum.length-1&&p.cum[i]<d)i++;const a=p.pts[i-1],b=p.pts[i],t=(d-p.cum[i-1])/((p.cum[i]-p.cum[i-1])||1);return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,i]}
function sub(p,d0,d1){if(d1<0||d0>p.tot)return;d0=Math.max(0,d0);d1=Math.min(p.tot,d1);if(d1<=d0)return;const A=at(p,d0),B=at(p,d1);cx.moveTo(A[0],A[1]);for(let i=A[2];i<B[2];i++)cx.lineTo(p.pts[i][0],p.pts[i][1]);cx.lineTo(B[0],B[1]);}
function draw(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;const dark=root.dataset.theme==="dark",c=dark?"226,176,86":"190,132,40";
cx.clearRect(0,0,W,H);cx.lineJoin="round";cx.lineCap="round";
cx.strokeStyle=`rgba(${c},${dark?.13:.2})`;cx.lineWidth=1;cx.beginPath();for(const p of paths){cx.moveTo(p.pts[0][0],p.pts[0][1]);for(let i=1;i<p.pts.length;i++)cx.lineTo(p.pts[i][0],p.pts[i][1]);}cx.stroke();
cx.fillStyle=`rgba(${c},${dark?.25:.3})`;for(const p of paths){const e=p.pts[p.pts.length-1];cx.beginPath();cx.arc(e[0],e[1],2.6,0,6.3);cx.fill();}
cx.shadowColor=`rgba(${c},.9)`;cx.shadowBlur=dark?10:5;
for(const p of paths){if(!rm)p.pos+=p.sp*dt;if(p.pos-p.len>p.tot)p.pos=-rnd(40,400);const L=p.len,h=p.pos;
[[1,.12,1.2],[.66,.35,1.8],[.33,.85,2.4]].forEach(([f,a,w],k,arr)=>{const a0=h-L*f,a1=h-(k<2?L*arr[k+1][0]:0);cx.strokeStyle=`rgba(${c},${dark?a:a*.8})`;cx.lineWidth=w;cx.beginPath();sub(p,k<2?a0:h-L*.33,k<2?h-L*(arr[k+1][0]):h);cx.stroke();});}
cx.shadowBlur=0;if(!rm&&!document.hidden)raf=requestAnimationFrame(draw)}
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{cancelAnimationFrame(raf);build();last=performance.now();raf=requestAnimationFrame(draw)},200)});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!rm){cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(draw)}});
new MutationObserver(()=>{if(rm)requestAnimationFrame(draw)}).observe(root,{attributes:true,attributeFilter:["data-theme"]});
build();raf=requestAnimationFrame(draw);})();
